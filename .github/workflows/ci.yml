name: CI

on:
  pull_request:
    branches: [ dev, main ]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.pipeline == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.pipeline == 'true' }}
      e2e: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.e2e == 'true' || steps.filter.outputs.pipeline == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            e2e:
              - 'e2e/**'
            pipeline:
              - '.github/**'

  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipUnitTests=true

      - name: Unit tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify -DskipUnitTests=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: task-app-frontend:pr
          cache-from: type=gha,scope=frontend

      - name: Verify that the image serves the frontend with the given API URL
        run: |
          docker run --detach --name frontend --publish 8081:8080 \
            --env API_URL=https://backend.example.test task-app-frontend:pr

          for attempt in $(seq 1 15); do
            if curl --fail --silent http://localhost:8081/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://localhost:8081/ | grep -q 'id="task-list"'
          curl --fail --silent --show-error http://localhost:8081/config.js | grep -q 'https://backend.example.test'

          echo "Frontend image serves the page and the configured API URL"

      - name: Show container logs on failure
        if: failure()
        run: docker logs frontend || true

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [ changes, build ]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.e2e == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build backend
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipUnitTests=true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests against local backend and frontend
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
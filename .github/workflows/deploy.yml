name: Deploy

on:
  push:
    branches: [ dev, main ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.pipeline == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.pipeline == 'true' }}
      e2e: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.e2e == 'true' || steps.filter.outputs.pipeline == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref_name }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            e2e:
              - 'e2e/**'
            pipeline:
              - '.github/**'

  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: changes
    if: github.ref == 'refs/heads/dev' && needs.changes.outputs.backend == 'true'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipUnitTests=true

      - name: Unit tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify -DskipUnitTests=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  backend-image:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs: [ changes, build ]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/dev' && needs.changes.outputs.backend == 'true' }}

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  frontend-image:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    needs: changes
    if: github.ref == 'refs/heads/dev' && needs.changes.outputs.frontend == 'true'

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Verify that the image serves the frontend with the given API URL
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker run --detach --name frontend --publish 8081:8080 \
            --env API_URL=https://backend.example.test "$IMAGE"

          for attempt in $(seq 1 15); do
            if curl --fail --silent http://localhost:8081/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://localhost:8081/ | grep -q 'id="task-list"'
          curl --fail --silent --show-error http://localhost:8081/config.js | grep -q 'https://backend.example.test'

          echo "Frontend image serves the page and the configured API URL"

      - name: Show container logs on failure
        if: failure()
        run: docker logs frontend || true

  deploy-backend-development:
    name: Deploy backend to development
    runs-on: ubuntu-latest
    needs: [ changes, backend-image ]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/dev' && needs.changes.outputs.backend == 'true' }}

    environment:
      name: development
      url: ${{ vars.BACKEND_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: ./.github/actions/render-deploy
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          image: ${{ needs.backend-image.outputs.image }}

  deploy-frontend-development:
    name: Deploy frontend to development
    runs-on: ubuntu-latest
    needs: [ changes, frontend-image, deploy-backend-development ]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/dev' && needs.changes.outputs.frontend == 'true' }}

    environment:
      name: development
      url: ${{ vars.FRONTEND_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: ./.github/actions/render-deploy
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          image: ${{ needs.frontend-image.outputs.image }}

  e2e-development:
    name: End-to-end tests against development
    runs-on: ubuntu-latest
    needs: [ changes, deploy-backend-development, deploy-frontend-development ]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/dev' && needs.changes.outputs.e2e == 'true' }}

    environment:
      name: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for the backend
        uses: ./.github/actions/wait-for-url
        with:
          url: ${{ vars.BACKEND_URL }}/api/tasks

      - name: Wait for the frontend
        uses: ./.github/actions/wait-for-url
        with:
          url: ${{ vars.FRONTEND_URL }}

      - name: Run end-to-end tests
        working-directory: e2e
        env:
          BASE_URL: ${{ vars.FRONTEND_URL }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-development
          path: e2e/playwright-report/
          if-no-files-found: ignore

  mark-verified:
    name: Mark tested images as verified
    runs-on: ubuntu-latest
    needs: [ backend-image, frontend-image, e2e-development ]
    if: ${{ !cancelled() && github.ref == 'refs/heads/dev' && needs.e2e-development.result == 'success' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag the backend image as verified
        if: needs.backend-image.result == 'success'
        env:
          IMAGE: ${{ needs.backend-image.outputs.image }}
        run: |
          docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY,,}:dev-verified" "$IMAGE"
          echo "Backend $IMAGE is now dev-verified"

      - name: Tag the frontend image as verified
        if: needs.frontend-image.result == 'success'
        env:
          IMAGE: ${{ needs.frontend-image.outputs.image }}
        run: |
          docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY,,}-frontend:dev-verified" "$IMAGE"
          echo "Frontend $IMAGE is now dev-verified"

  deploy-backend-production:
    name: Deploy backend to production
    runs-on: ubuntu-latest
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'

    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the verified image
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:dev-verified" >> "$GITHUB_OUTPUT"

      - name: Show the image being promoted
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker buildx imagetools inspect "$IMAGE"

      - name: Deploy to Render
        uses: ./.github/actions/render-deploy
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          image: ${{ steps.image.outputs.image }}

  deploy-frontend-production:
    name: Deploy frontend to production
    runs-on: ubuntu-latest
    needs: [ changes, deploy-backend-production ]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.changes.outputs.frontend == 'true' }}

    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the verified image
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-frontend:dev-verified" >> "$GITHUB_OUTPUT"

      - name: Show the image being promoted
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker buildx imagetools inspect "$IMAGE"

      - name: Deploy to Render
        uses: ./.github/actions/render-deploy
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          image: ${{ steps.image.outputs.image }}

  smoke-production:
    name: Smoke test production
    runs-on: ubuntu-latest
    needs: [ deploy-backend-production, deploy-frontend-production ]
    if: ${{ !cancelled() && !failure() && (needs.deploy-backend-production.result == 'success' || needs.deploy-frontend-production.result == 'success') }}

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for the backend
        uses: ./.github/actions/wait-for-url
        with:
          url: ${{ vars.BACKEND_URL }}/api/tasks

      - name: Wait for the frontend
        uses: ./.github/actions/wait-for-url
        with:
          url: ${{ vars.FRONTEND_URL }}

      - name: Verify that the frontend and backend are wired together
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          backend="${BACKEND_URL%/}"
          frontend="${FRONTEND_URL%/}"

          curl --fail --silent --show-error "${frontend}/" | grep -q 'id="task-list"'
          echo "The frontend serves the page"

          curl --fail --silent --show-error "${frontend}/config.js" | grep -q "${backend}"
          echo "The frontend points at ${backend}"

          curl --fail --silent --show-error --dump-header - --output /dev/null \
            --header "Origin: ${frontend}" "${backend}/api/tasks" \
            | grep -qi "^access-control-allow-origin: ${frontend}"
          echo "The backend accepts requests from ${frontend}"
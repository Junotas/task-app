name: Deploy

on:
  push:
    branches: [ dev, main ]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipUnitTests=true

      - name: Unit tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify -DskipUnitTests=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  image:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-image:
    name: Build and push frontend image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Verify that the image serves the frontend with the given API URL
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker run --detach --name frontend --publish 8081:8080 \
            --env API_URL=https://backend.example.test "$IMAGE"

          for attempt in $(seq 1 15); do
            if curl --fail --silent http://localhost:8081/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://localhost:8081/ | grep -q 'id="task-list"'
          curl --fail --silent --show-error http://localhost:8081/config.js | grep -q 'https://backend.example.test'

          echo "Frontend image serves the page and the configured API URL"

      - name: Show container logs on failure
        if: failure()
        run: docker logs frontend || true

  deploy-development:
    name: Deploy to development
    runs-on: ubuntu-latest
    needs: image
    if: github.ref == 'refs/heads/dev'

    environment:
      name: development
      url: ${{ vars.APP_URL }}

    steps:
      - name: Trigger Render deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          response=$(curl --fail --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{\"imageUrl\":\"${IMAGE}\"}")

          deploy_id=$(echo "$response" | jq -r '.id')

          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
            echo "Render did not return a deploy id"
            echo "$response"
            exit 1
          fi

          echo "Triggered deploy $deploy_id with image $IMAGE"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          for attempt in $(seq 1 90); do
            status=$(curl --fail --silent --show-error \
              --url "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json" | jq -r '.status')

            echo "Attempt ${attempt}: ${status}"

            case "$status" in
              live)
                echo "Deploy is live"
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Deploy ended with status ${status}"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for the deploy to go live"
          exit 1

  e2e-development:
    name: End-to-end tests against development
    runs-on: ubuntu-latest
    needs: deploy-development
    if: github.ref == 'refs/heads/dev'

    environment:
      name: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for the application to respond
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          base="${APP_URL%/}"

          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 60 "${base}/api/tasks" || true)

            echo "Attempt ${attempt}: HTTP ${code}"

            if [ "$code" = "200" ]; then
              exit 0
            fi

            sleep 10
          done

          echo "The application did not respond in time"
          exit 1

      - name: Run end-to-end tests
        working-directory: e2e
        env:
          BASE_URL: ${{ vars.APP_URL }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-development
          path: e2e/playwright-report/
          if-no-files-found: ignore

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: image
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Trigger Render deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          response=$(curl --fail --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{\"imageUrl\":\"${IMAGE}\"}")

          deploy_id=$(echo "$response" | jq -r '.id')

          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
            echo "Render did not return a deploy id"
            echo "$response"
            exit 1
          fi

          echo "Triggered deploy $deploy_id with image $IMAGE"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          for attempt in $(seq 1 90); do
            status=$(curl --fail --silent --show-error \
              --url "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json" | jq -r '.status')

            echo "Attempt ${attempt}: ${status}"

            case "$status" in
              live)
                echo "Deploy is live"
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Deploy ended with status ${status}"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for the deploy to go live"
          exit 1

  smoke-production:
    name: Smoke test production
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Verify that production serves the API and the frontend
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          base="${APP_URL%/}"

          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 60 "${base}/api/tasks" || true)

            echo "Attempt ${attempt}: HTTP ${code}"

            if [ "$code" = "200" ]; then
              break
            fi

            if [ "$attempt" = "30" ]; then
              echo "The API did not respond in time"
              exit 1
            fi

            sleep 10
          done

          page=$(curl --fail --silent --show-error --max-time 60 "${base}/")

          if ! echo "$page" | grep -q "task-list"; then
            echo "The frontend was not served as expected"
            exit 1
          fi

          echo "Production is serving both the API and the frontend"